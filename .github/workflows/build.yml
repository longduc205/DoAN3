name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: websec_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U websec_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Integration tests create and drop a throwaway database on this server.
      TEST_DATABASE_URL: Host=localhost;Port=5432;Database=postgres;Username=websec_ci;Password=ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build backend/WebSecPlatform.sln
      - run: dotnet test backend/WebSecPlatform.sln --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false
