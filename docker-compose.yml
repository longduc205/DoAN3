name: websec

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-Host=postgres;Port=5432;Database=websec_dev;Username=websec_dev;Password=change_me_local_only}
  JWT_ISSUER: ${JWT_ISSUER:-WebSecPlatform}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-WebSecPlatformClient}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-replace_with_a_long_random_development_key}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-true}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-websec_dev}
      POSTGRES_USER: ${POSTGRES_USER:-websec_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "127.0.0.1:5432:5432" # local machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ./backend, target: api }
    environment:
      <<: *backend-env
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    build: { context: ./backend, target: worker }
    environment:
      <<: *backend-env
      DOTNET_ENVIRONMENT: Development
    depends_on:
      api: { condition: service_healthy } # api applies migrations first

  frontend:
    build: { context: ./frontend }
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      - api

volumes:
  pgdata:
